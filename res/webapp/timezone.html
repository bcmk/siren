<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>{{.Header}}</title>
<script src="https://telegram.org/js/telegram-web-app.js">
</script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
}
.header {
    padding: 16px 16px 0;
    font-size: 17px;
    font-weight: 600;
}
.current {
    padding: 8px 16px 0;
    font-size: 14px;
    color: var(--tg-theme-hint-color, #999);
}
.search-box {
    padding: 12px;
    position: sticky;
    top: 0;
    background: var(--tg-theme-bg-color, #fff);
}
.search-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    border-radius: 8px;
    font-size: 16px;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #000);
    outline: none;
}
.search-box input::placeholder {
    color: var(--tg-theme-hint-color, #999);
}
.results {
    list-style: none;
}
.results li {
    padding: 12px 16px;
    border-bottom: 1px solid
        var(--tg-theme-secondary-bg-color, #eee);
    cursor: pointer;
    font-size: 15px;
}
.results li:active,
.results li.selected {
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-accent-text-color,
        var(--tg-theme-text-color, #000));
}
.results .note {
    margin-left: 8px;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #999);
}
.hint {
    padding: 16px;
    text-align: center;
    color: var(--tg-theme-hint-color, #999);
    font-size: 14px;
}
.spinner {
    display: none;
    width: 20px;
    height: 20px;
    margin: 16px auto;
    border: 2px solid var(--tg-theme-hint-color, #ccc);
    border-top-color: var(--tg-theme-button-color, #999);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<h1 class="header">{{.Header}}</h1>
<div class="current">{{.Current}}: {{.CurrentZone}}</div>
<div class="search-box">
    <input type="text" id="q" placeholder="{{.Placeholder}}"
        maxlength="64" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" autofocus>
</div>
<div class="spinner" id="spinner"></div>
<ul class="results" id="results"></ul>
<div class="hint" id="hint"></div>
<script>
var detectedLabel = "{{.Detected}}";
var noResults = "{{.NoResults}}";
var failed = "{{.Failed}}";
var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

var endpoint = new URLSearchParams(location.search).get("endpoint");
var input = document.getElementById("q");
var resultsList = document.getElementById("results");
var hint = document.getElementById("hint");
var spinner = document.getElementById("spinner");
var selectedIdx = -1;

// The bot serves the list it will accept, so nothing here can be offered and then refused.
// The browser's own zone database is asked only where it lives, never what exists.
var zones = {{ .Zones }};
var known = {};
for (var i = 0; i < zones.length; i++) {
    known[zones[i].toLowerCase()] = zones[i];
}
var detected = "";
try {
    var reported = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    detected = known[reported.toLowerCase()] || "";
} catch (e) {
    detected = "";
}

// A typed query matches an underscore as the space it reads as,
// so "new york" finds America/New_York.
function normalize(s) {
    return s.toLowerCase().replace(/_/g, " ");
}

function item(zone, note) {
    var li = document.createElement("li");
    li.setAttribute("data-zone", zone);
    li.appendChild(document.createTextNode(zone));
    if (note) {
        var span = document.createElement("span");
        span.className = "note";
        span.textContent = note;
        li.appendChild(span);
    }
    return li;
}

// The detected zone leads the list, so the common answer is the first tap.
// The rows are built off the document and attached in one go:
// an empty query matches every zone the bot holds, and appending them one by one
// would lay the page out afresh hundreds of times per keystroke.
function render(q) {
    resultsList.innerHTML = "";
    hint.textContent = "";
    selectedIdx = -1;
    var batch = document.createDocumentFragment();
    var shown = 0;
    if (detected && normalize(detected).indexOf(q) !== -1) {
        batch.appendChild(item(detected, detectedLabel));
        shown++;
    }
    for (var i = 0; i < zones.length; i++) {
        if (zones[i] === detected) continue;
        if (normalize(zones[i]).indexOf(q) === -1) continue;
        batch.appendChild(item(zones[i], ""));
        shown++;
    }
    resultsList.appendChild(batch);
    if (shown === 0) {
        hint.textContent = noResults;
    }
}

resultsList.addEventListener("click", function(e) {
    var row = e.target.closest("li");
    if (row) {
        submit(row.getAttribute("data-zone"));
    }
});

input.addEventListener("input", function() {
    render(normalize(this.value.trim()));
});

function updateSelection() {
    var items = resultsList.children;
    for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle("selected", i === selectedIdx);
    }
    if (selectedIdx >= 0 && items[selectedIdx]) {
        items[selectedIdx].scrollIntoView({block: "nearest"});
    }
}

// Enter commits only what the user pointed at: a selected row, or a query narrowed to one.
// The list is filled from the start, so taking its first row
// would turn the keyboard's own dismiss key into a save nobody asked for,
// and the list is the set the bot accepts, so no rows means no save to attempt.
input.addEventListener("keydown", function(e) {
    var items = resultsList.children;
    if (e.key === "ArrowDown") {
        if (items.length === 0) return;
        e.preventDefault();
        if (selectedIdx < items.length - 1) selectedIdx++;
        updateSelection();
    } else if (e.key === "ArrowUp") {
        if (items.length === 0) return;
        e.preventDefault();
        if (selectedIdx > -1) selectedIdx--;
        updateSelection();
    } else if (e.key === "Enter") {
        if (selectedIdx >= 0 && items[selectedIdx]) {
            e.preventDefault();
            submit(items[selectedIdx].getAttribute("data-zone"));
            return;
        }
        if (items.length === 1) {
            e.preventDefault();
            submit(items[0].getAttribute("data-zone"));
        }
    }
});

function submit(zone) {
    spinner.style.display = "block";
    hint.textContent = "";
    resultsList.innerHTML = "";
    input.disabled = true;
    var url = "/apps/timezone/api/submit?endpoint=" +
        encodeURIComponent(endpoint) +
        "&timezone=" + encodeURIComponent(zone);
    fetch(url, {
        method: "POST",
        headers: {"X-Init-Data": tg.initData}
    })
    .then(function(r) {
        if (r.ok) {
            tg.close();
            return;
        }
        fail();
    })
    .catch(function() {
        fail();
    });
}

// The list comes back first, since render clears the hint the failure is written into.
function fail() {
    spinner.style.display = "none";
    input.disabled = false;
    render(normalize(input.value.trim()));
    hint.textContent = failed;
}

render("");
</script>
</body>
</html>
