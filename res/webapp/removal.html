<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>{{.Header}}</title>
<script src="https://telegram.org/js/telegram-web-app.js">
</script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
}
.header {
    padding: 16px 16px 0;
    font-size: 17px;
    font-weight: 600;
}
.search-box {
    padding: 12px;
    position: sticky;
    top: 0;
    background: var(--tg-theme-bg-color, #fff);
}
.search-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    border-radius: 8px;
    font-size: 16px;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #000);
    outline: none;
}
.search-box input::placeholder {
    color: var(--tg-theme-hint-color, #999);
}
.results {
    list-style: none;
}
.results li {
    padding: 12px 16px;
    border-bottom: 1px solid
        var(--tg-theme-secondary-bg-color, #eee);
    cursor: pointer;
    font-size: 15px;
}
.results li:active,
.results li.selected {
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-accent-text-color,
        var(--tg-theme-text-color, #000));
}
.hint {
    padding: 16px;
    text-align: center;
    color: var(--tg-theme-hint-color, #999);
    font-size: 14px;
}
.spinner {
    display: none;
    width: 20px;
    height: 20px;
    margin: 16px auto;
    border: 2px solid var(--tg-theme-hint-color, #ccc);
    border-top-color: var(--tg-theme-button-color, #999);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<h1 class="header">{{.Header}}</h1>
<div class="search-box">
    <input type="text" id="q" placeholder="{{.Placeholder}}"
        maxlength="32" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" autofocus>
</div>
<div class="spinner" id="spinner"></div>
<ul class="results" id="results"></ul>
<div class="hint" id="hint"></div>
<script>
var noSubscriptions = "{{.NoSubscriptions}}";
var noResults = "{{.NoResults}}";
var failed = "{{.Failed}}";
var failedToRemove = "{{.FailedToRemove}}";
var tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

var endpoint = new URLSearchParams(location.search).get("endpoint");
var input = document.getElementById("q");
var resultsList = document.getElementById("results");
var hint = document.getElementById("hint");
var spinner = document.getElementById("spinner");
var selectedIdx = -1;

// The bot serves what the caller may remove,
// so nothing here can be offered and then refused.
// null until the list arrives:
// typing must not repaint a loading or failed page as "no subscriptions".
var streamers = null;

function item(nickname) {
    var li = document.createElement("li");
    li.setAttribute("data-streamer", nickname);
    li.textContent = nickname;
    return li;
}

// The rows are built off the document and attached in one go,
// as the timezone page builds them:
// an empty query matches every subscription, hundreds for a heavy user.
function render(q) {
    if (streamers === null) return;
    resultsList.innerHTML = "";
    hint.textContent = "";
    selectedIdx = -1;
    var batch = document.createDocumentFragment();
    var shown = 0;
    for (var i = 0; i < streamers.length; i++) {
        if (streamers[i].indexOf(q) === -1) continue;
        batch.appendChild(item(streamers[i]));
        shown++;
    }
    resultsList.appendChild(batch);
    if (streamers.length === 0) {
        hint.textContent = noSubscriptions;
    } else if (shown === 0) {
        hint.textContent = noResults;
    }
}

function query() {
    return input.value.trim().toLowerCase();
}

resultsList.addEventListener("click", function(e) {
    var row = e.target.closest("li");
    if (row) {
        submit(row.getAttribute("data-streamer"));
    }
});

input.addEventListener("input", function() {
    render(query());
});

function updateSelection() {
    var items = resultsList.children;
    for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle("selected", i === selectedIdx);
    }
    if (selectedIdx >= 0 && items[selectedIdx]) {
        items[selectedIdx].scrollIntoView({block: "nearest"});
    }
}

// Enter commits only what the user pointed at: a selected row, or a query narrowed to one.
// The list is filled from the start, so taking its first row
// would turn the keyboard's own dismiss key into a removal nobody asked for.
input.addEventListener("keydown", function(e) {
    var items = resultsList.children;
    if (e.key === "ArrowDown") {
        if (items.length === 0) return;
        e.preventDefault();
        if (selectedIdx < items.length - 1) selectedIdx++;
        updateSelection();
    } else if (e.key === "ArrowUp") {
        if (items.length === 0) return;
        e.preventDefault();
        if (selectedIdx > -1) selectedIdx--;
        updateSelection();
    } else if (e.key === "Enter") {
        if (selectedIdx >= 0 && items[selectedIdx]) {
            e.preventDefault();
            submit(items[selectedIdx].getAttribute("data-streamer"));
            return;
        }
        if (items.length === 1 && query() !== "") {
            e.preventDefault();
            submit(items[0].getAttribute("data-streamer"));
        }
    }
});

function load() {
    spinner.style.display = "block";
    fetch("/apps/remove/api/list?endpoint=" + encodeURIComponent(endpoint), {
        method: "POST",
        headers: {"X-Init-Data": tg.initData}
    })
    .then(function(r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
    })
    .then(function(list) {
        spinner.style.display = "none";
        streamers = list;
        render(query());
    })
    .catch(function() {
        spinner.style.display = "none";
        hint.textContent = failed;
    });
}

// The bot answers in the chat, so closing here leaves the confirmation behind the page.
function submit(nickname) {
    spinner.style.display = "block";
    hint.textContent = "";
    resultsList.innerHTML = "";
    input.disabled = true;
    var url = "/apps/remove/api/submit?endpoint=" + encodeURIComponent(endpoint) +
        "&streamer=" + encodeURIComponent(nickname);
    fetch(url, {
        method: "POST",
        headers: {"X-Init-Data": tg.initData}
    })
    .then(function(r) {
        if (r.ok) {
            tg.close();
            return;
        }
        fail(nickname);
    })
    .catch(function() {
        fail(nickname);
    });
}

// The list comes back first, since render clears the hint the failure is written into.
function fail(nickname) {
    spinner.style.display = "none";
    input.disabled = false;
    render(query());
    hint.textContent = failedToRemove + " " + nickname;
}

load();
</script>
</body>
</html>
