    <b>2. 20% revenue share</b>
    Open <a href="https://chaturbate.com/affiliates">chaturbate.com/affiliates</a>,
    scroll to the very bottom and copy the link there.
    You get 20% of everything your users spend.

    Then send the copied link here, like this:
    <code>{{ command "affiliate" }} https://chaturbate.com/in/?tour=LQps&amp;campaign=WIl8t&amp;track=default&amp;room={{ template "sample_streamer" }}</code>

    <i>The pages and payouts above are what Chaturbate published
    at the time of writing and may have changed since.
    Check their site for the current terms.</i>
faq_no_notifications:
  parse: html
  str: >
    <b>I've subscribed to a model but I don't receive notifications</b>

    We use the same list of online models as affiliate sites use for advertisements.
    Some models decided to not appear there so we cannot know when they are online.
    You can tell a model about this bot and a model may probably change her or his mind on this setting.
    The setting is <b>My Profile</b> → <b>Settings &amp; Privacy</b> → <b>Appear on network sites</b> → <b>Yes</b>.
    Please let us know if you don't receive notifications for some models and we will try to fix it.
    However, there is no guarantee that this will work.
faq_direct_subscriptions:
  parse: html
  str: >
    <b>It would be nice if I can subscribe to models directly from their profile pages</b>

    Actually models can provide a link on their profile pages and a floating icon exacly for this purpose.
    You can tell a model about this feature.
faq:
