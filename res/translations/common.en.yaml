hello:
  parse: html
  str: The bot notifies you whenever your favorite <a href="{{ . }}">{{ template "site" }}</a> models are online.
start:
  parse: html
  disable_preview: true
  str: |-
    {{ template "help" . }}
help:
  parse: html
  disable_preview: true
  str: |-
    {{ template "hello" .website_link }}

    {{ template "commands" }}

    {{ template "languages" }}

    {{ template "sites" }}

    {{ template "social" }}
ok:
  parse: raw
  str: OK
add_error:
  parse: html
  str: |-
    Could not add the model {{ .streamer }}
    Check the camname or try later
    Syntax: {{ command "add" }} <code>CAMNAME</code>
checking_streamer:
  parse: raw
  str: Give us a second. We are checking this model
all_streamers_removed:
  parse: raw
  str: All your subscriptions removed
already_added:
  parse: raw
  str: "Model {{ .streamer }} is already in your list"
denied:
  parse: raw
  str: "{{ .streamer }} has blocked access from the location of this bot"
feedback:
  parse: raw
  str: Thank you for your feedback!
follower_exists:
  parse: raw
  str: Referral links only work for new users
raw_commands:
  parse: raw
  str: |-
    referral - Your referral link
    buy_subs - Buy more subscriptions
    add - Add model
    remove - Remove model
    remove_all - Remove all models
    list - Your model subscriptions
    pics - Pictures of your models online
    week - Camming hours in the previous 7 days
    help - Help
    settings - Show settings
    feedback - Send feedback
commands:
  parse: html
  str: |-
    <b>Commands</b>

    <b>{{ short_command "add" }}</b> <code>CAMNAME</code> — Add model
    <b>{{ short_command "remove" }}</b> <code>CAMNAME</code> — Remove model
    <b>{{ short_command "remove_all" }}</b> — Remove all models
    <b>{{ short_command "list" }}</b> — Your model subscriptions
    <b>{{ short_command "pics" }}</b> — Pictures of your models online
    <b>{{ short_command "week" }}</b> <code>CAMNAME</code> — Camming hours in the previous 7 days
    <b>{{ short_command "help" }}</b> — Help
    <b>{{ short_command "settings" }}</b> — Show settings
    <b>{{ short_command "feedback" }}</b> <code>YOUR_MESSAGE</code> — Send feedback
invalid_command:
  parse: raw
  str: Invalid command
invalid_referral_link:
  parse: raw
  str: Your referral link is invalid
invalid_symbols:
  parse: raw
  disable_preview: true
  str: "Camname {{ .streamer }} has invalid symbols"
streamer_added:
  parse: raw
  str: |-
    Model {{ .streamer }} added successfully
    Bot will notify you whenever they enters or leaves
streamer_not_in_list:
  parse: raw
  str: "Model {{ .streamer }} is not in your list"
streamer_removed:
  parse: raw
  str: "Model {{ .streamer }} removed successfully"
no_online_streamers:
  parse: raw
  str: There are no online models you subscribed to
not_enough_subscriptions:
  parse: raw
  str: You have not enough available subscriptions
online:
  parse: html
  disable_preview: true
  str: |-
    🟢
    {{- print " " -}}
    {{- .streamer_link }}
    {{- print " " -}}
    <i>online
    {{- if .time_diff }} for {{ template "duration" .time_diff }}{{ end -}}
    {{- with .show_kind }}{{ print "\n" }}{{ template "show_kind" . }}{{ end -}}
    {{- if .viewers }}{{ print "\n" }}viewers: {{ .viewers }}{{ end -}}
    {{- if .subject }}{{ print "\n" }}<blockquote>{{ .subject }}</blockquote>{{ end -}}
    </i>
show_kind:
  str: |-
    {{- if eq . 1 -}}in a public show
    {{- else if eq . 2 -}}in a group show
    {{- else if eq . 3 -}}in a ticket show
    {{- else if eq . 4 -}}in a hidden show
    {{- else if eq . 5 -}}in a private show
    {{- else if eq . 6 -}}away
    {{- end -}}
offline:
  parse: html
  disable_preview: true
  str: |-
    🔴
    {{- print " " -}}
    {{- .streamer_link }}
    {{- print " " -}}
    <i>offline {{- if .time_diff }}, last seen {{ template "duration" .time_diff }} ago {{- end -}}</i>
zero_subscriptions:
  parse: html
  str: |-
    You are not subscribed to any model
    To subscribe enter

    {{ command "add" }} <code>CAMNAME</code>
list:
  parse: html
  disable_preview: true
  str: |-
    {{- $printed := false -}}
    {{- if .online -}}
      {{- $printed = true -}}
      🟢
      {{- print " " -}}
      <code>ONLINE</code>
      {{- print "\n" -}}
      {{- range .online -}}
        {{- .Link -}}
        {{- if .TimeDiff }}  <i>for {{ template "duration" .TimeDiff }}</i> {{- end -}}
        {{- print "\n" -}}
      {{- end -}}
    {{- end -}}

    {{- if .offline -}}
      {{- if $printed -}}
        {{- print "\n" -}}
      {{- end -}}
      {{- $printed = true -}}
      🔴
      {{- print " " -}}
      <code>OFFLINE</code>
      {{- print "\n" -}}
      {{- range .offline -}}
        {{- .Link -}}
        {{- if .TimeDiff }}  <i>last seen {{ template "duration" .TimeDiff }}</i> ago {{- end -}}
        {{- print "\n" -}}
      {{- end -}}
    {{- end -}}

    {{- if and (not .online) (not .offline) -}}
      {{- template "zero_subscriptions" -}}
    {{- end -}}
own_referral_link_hit:
  parse: raw
  str: You've just hit your own referral link
profile_removed:
  parse: raw
  str: "Model {{ .streamer }} probably has removed their profile"
referral_applied:
  parse: raw
  str: Congrats! You've just got more subscriptions for the referral link!
referral_link:
  disable_preview: true
  parse: raw
  str: |-
    {{ template "subscription_usage" . }}

    Earn additional subscriptions by sharing this referral link!
    {{ .link }}

    You will get {{ .referral_bonus }} additional subscriptions for every new registered user
    New user will get {{ .follower_bonus }} additional subscriptions
want_more:
  disable_preview: true
  parse: raw
  str: |-
    {{ template "referral_link" . }}
    {{- if .buy_subs_enabled }}

    Or buy more right away with Telegram Stars: {{ command "buy_subs" }}
    {{- end }}
remove_all:
  parse: raw
  str: |-
    If you really want to remove all the subscriptions then enter

    {{ command "sure_remove_all" }}
social:
  disable_preview: true
  parse: html
  str: |-
    <b>Social</b>
    X: https://x.com/siren_tlg
    News channel: https://t.me/siren_telegram_bot
    Reddit: https://www.reddit.com/user/siren_tlg
    GitHub: https://github.com/bcmk/siren
subscription_usage:
  parse: raw
  str: "Subscriptions usage: {{ .subscriptions_used }}/{{ .total_subscriptions }}"
subscription_usage_ad:
  parse: raw
  str: |-
    {{ template "subscription_usage" . }}
    Want more subscriptions? Type

    {{ command "want_more" }}
settings:
  parse: html
  str: |-
    {{ template "subscription_usage" . }}
    Need more? Type {{ command "want_more" }}

    Show images in notifications: <b>{{ template "yes_no" .show_images }}</b>
    {{- print "\n" -}}
    {{- if .show_images  -}}
      Disable: {{ command "disable_images" }}
    {{- else -}}
      Enable: {{ command "enable_images" }}
    {{- end -}}

    {{- if .offline_notifications_supported -}}
      {{- print "\n" -}}
      {{- print "\n" -}}
      Send offline notifications: <b>{{ template "yes_no" .offline_notifications }}</b>
      {{- print "\n" -}}
      {{- if .offline_notifications  -}}
        Disable: {{ command "disable_offline_notifications" }}
      {{- else -}}
        Enable: {{ command "enable_offline_notifications" }}
      {{- end -}}
    {{- end -}}

    {{- if .subject_supported -}}
      {{- print "\n" -}}
      {{- print "\n" -}}
      Show room subject: <b>{{ template "yes_no" .show_subject }}</b>
      {{- print "\n" -}}
      {{- if .show_subject -}}
        Disable: {{ command "disable_subject" }}
      {{- else -}}
        Enable: {{ command "enable_subject" }}
      {{- end -}}
    {{- end -}}

    {{- print "\n" -}}
    {{- print "\n" -}}
    Silent messages (no sound): <b>{{ template "yes_no" .silent_messages }}</b>
    {{- print "\n" -}}
    {{- if .silent_messages -}}
      Disable: {{ command "disable_silent_messages" }}
    {{- else -}}
      Enable: {{ command "enable_silent_messages" }}
    {{- end -}}

    {{- if .in_group -}}
      {{- print "\n" -}}
      {{- print "\n" -}}
      Members can add and remove {{ template "streamers_accusative" }}: <b>{{ template "yes_no" .member_subscriptions }}</b>
      {{- print "\n" -}}
      {{- if .member_subscriptions -}}
        Disable: {{ command "disable_member_subscriptions" }}
      {{- else -}}
        Enable: {{ command "enable_member_subscriptions" }}
      {{- end -}}
    {{- end -}}

    {{- print "\n" -}}
    {{- print "\n" -}}
    Timezone: <b>{{ .timezone }}</b>
    {{- print "\n" -}}
    Change: {{ command "timezone" }}{{ if .timezone_set }}, reset: {{ command "reset_timezone" }}{{ end }}

    {{- if .can_manage_affiliate -}}
      {{- print "\n" -}}
      {{- print "\n" -}}
      Affiliate link: <b>{{ if .affiliate_params }}set{{ else }}not set{{ end }}</b>
      {{- print "\n" -}}
      Manage: {{ command "affiliate" }}{{ if .affiliate_params }}, reset: {{ command "reset_affiliate" }}{{ end }}
    {{- end -}}
yes_no:
  parse: raw
  str: "{{- if . -}} yes {{- else -}} no {{- end -}}"
# What a site calls the people it broadcasts. Every site file overrides it.
# The key names the case, so another case is another key.
streamers_accusative:
  parse: raw
  str: streamers
sample_streamer:
  parse: raw
  str: your_channel
affiliate_status:
  parse: html
  disable_preview: true
  str: |-
    Your affiliate link is active.
    Affiliate ID: <b>{{ .affiliate_id }}</b>

    Your model links now look like this:
    <code>{{ .affiliate_base }}/{{ template "sample_streamer" }}{{ with .affiliate_query }}?{{ . }}{{ end }}</code>
    Each one redirects through your {{ template "site" }} affiliate link, so the payouts are yours.

    To change it, send {{ command "affiliate" }} <code>LINK</code>
    To reset, {{ command "reset_affiliate" }}
affiliate_invalid:
  parse: html
  disable_preview: true
  str: |-
    Could not read that. Make sure you pasted the whole {{ template "site" }} affiliate link.

    {{ template "affiliate_instructions" . }}
admins_only:
  parse: raw
  str: |-
    Only group admins can do this.
    {{- if .member_subscriptions -}}
      {{- print "\n" -}}
      An admin can open this to members in {{ command "settings" }}
    {{- end -}}
affiliate_groups_only:
  parse: raw
  str: Your own affiliate link is set per group or channel. Add the bot to yours and run this command there.
groups_only:
  parse: raw
  str: This setting is for a group. Add the bot to yours and run this command there.
timezone_help:
  str: >-
    Specify a timezone from the
    <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones">IANA list</a>,
    e.g., <code>{{ command "timezone" }} Europe/Berlin</code>
timezone_button:
  parse: raw
  str: Or Choose Timezone
timezone_app_header:
  parse: raw
  str: Choose your timezone
timezone_app_current:
  parse: raw
  str: Current
timezone_app_detected:
  parse: raw
  str: your device
timezone_app_placeholder:
  parse: raw
  str: Search timezones
timezone_app_no_results:
  parse: raw
  str: No such timezone
timezone_app_failed:
  parse: raw
  str: Could not save the timezone
timezone:
  parse: html
  disable_preview: true
  str: |-
    Timezone: <b>{{ .timezone }}</b>
    {{- if .help -}}
      {{- print "\n\n" -}}
      {{- template "timezone_help" -}}
    {{- end -}}
timezone_invalid:
  parse: html
  disable_preview: true
  str: |-
    Unknown timezone.

    {{ template "timezone_help" }}
affiliate_nothing_to_reset:
  parse: raw
  str: Nothing to reset — this chat has no custom affiliate link.
affiliate_command:
  parse: raw
  str: Set your affiliate link so payouts go to you
affiliate_instructions:
  parse: html
  str: |-
    To use your own affiliate link, open your account on the site, generate an affiliate link to the home page, copy it, and send it here as:
    <code>{{ command "affiliate" }} PASTE_LINK</code>
syntax_feedback:
  parse: html
  str: |-
    Enter

    {{ command "feedback" }} <code>YOUR_MESSAGE</code>
syntax_add:
  parse: html
  str: |-
    Specify a model, e.g., <code>{{ template "add_example" }}</code>
search_button:
  parse: raw
  str: Or Find and Add
search_header:
  parse: raw
  str: Find and add a model
search_placeholder:
  parse: raw
  str: Search...
search_no_results:
  parse: raw
  str: No results
search_failed:
  parse: raw
  str: Search failed
search_failed_to_add:
  parse: raw
  str: Failed to add
syntax_remove:
  parse: html
  str: |-
    Enter

    {{ command "remove" }} <code>CAMNAME</code>
unknown_command:
  parse: html
  str: |-
    Unknown command. To subscribe to a model enter

    {{ command "add" }} <code>CAMNAME</code>

    Example

    {{ template "add_example" }}
version:
  parse: raw
  str: "Version: {{ .version }}"
duration:
  str: |-
    {{- if and .Days (not .Hours) -}}
      {{ .Days }}d
    {{- else if .Days -}}
      {{ .Days }}d {{ .Hours }}h
    {{- else if and .Hours (not .Minutes) -}}
      {{ .Hours }}h
    {{- else if .Hours -}}
      {{ .Hours }}h {{ .Minutes }}m
    {{- else -}}
      {{ .Minutes }}m
    {{- end -}}
week:
  parse: html
  disable_preview: true
  str: |-
    {{- .streamer_link }}'s week ({{ .timezone }}):
    {{- print "\n\n" -}}
    <code>
    {{- printf "    00     06     12     18\n" -}}
    {{- $i := 0 -}}
    {{- $j := .weekday -}}
    {{- range .hours -}}
      {{- if eq (mod $i 24) 0 -}}
        {{- if ne $i 0 -}}{{- print "\n" -}}{{- end -}}
        {{- template "weekday" $j -}}:
        {{- $j = mod (add $j 1) 7 -}}
      {{ end }}
      {{- if eq (mod $i 6) 0 -}}
        {{- print " " -}}
      {{- end -}}
      {{- if . -}}#{{- else -}}-{{- end -}}
      {{- $i = add $i 1 -}}
    {{- end -}}
    </code>
week_chunk:
  parse: html
  disable_preview: true
  str: |-
    {{- range $i, $row := .rows -}}
      {{- if $i }}{{ print "\n\n" }}{{ end -}}
      {{- template "week" $row -}}
    {{- end -}}
week_never_online:
  parse: html
  disable_preview: true
  str: |-
    🔴
    {{- print " " -}}
    <code>NEVER ONLINE THIS WEEK</code>
    {{- print "\n" -}}
    {{- range .streamers -}}
      {{- .Link -}}
      {{- if .TimeDiff }}  <i>last seen {{ template "duration" .TimeDiff }}</i> ago {{- end -}}
      {{- print "\n" -}}
    {{- end -}}
week_retrieving:
  str: Retrieving data, please wait...
weekday:
  str: |-
    {{- if eq . 0 -}}Su{{- end -}}
    {{- if eq . 1 -}}Mo{{- end -}}
    {{- if eq . 2 -}}Tu{{- end -}}
    {{- if eq . 3 -}}We{{- end -}}
    {{- if eq . 4 -}}Th{{- end -}}
    {{- if eq . 5 -}}Fr{{- end -}}
    {{- if eq . 6 -}}Sa{{- end -}}
faq_pricing:
  parse: html
  str: >
    <b>Pricing</b>

    The basic service is free.
    If you need to subscribe to more than {{ .max_subs }} models you may earn
    additional subscriptions by sharing this service
    {{- if .buy_subs_enabled }} or buy them with Telegram Stars via {{ command "buy_subs" }}{{ end }}.
buy_subs:
  parse: html
  disable_preview: true
  str: |-
    Buy additional subscriptions with Telegram Stars.
    The more you buy, the cheaper each subscription is.

    Pick a package below.
buy_subs_package_button:
  parse: raw
  str: |-
    {{- .count }} subs · {{ .stars }} ⭐
    {{- if .discount }} (-{{ .discount }}%){{ end -}}
buy_subs_invoice_title:
  parse: raw
  str: "{{ .count }} extra subs"
buy_subs_invoice_description:
  parse: raw
  str: "One-time purchase. Adds {{ .count }} extra subs on this bot for life."
buy_subs_invoice_label:
  parse: raw
  str: "{{ .count }} subs"
buy_invoice_failed:
  parse: raw
  str: Could not start the payment. Please try again later.
buy_invoice_expired:
  parse: raw
  str: This invoice is no longer valid. Please try again.
buy_already_credited:
  parse: raw
  str: This payment has already been credited.
subs_purchased:
  parse: raw
  str: |-
    Thank you! {{ .added }} subscriptions added.
    New total: {{ .total_subscriptions }}
too_many_subscriptions_for_pics:
  str: This command supports up to {{ .max_subs }} subscriptions in a group chat
we_are_up:
  str: We are up again
fields_customization_hint:
  parse: html
  str: '<i>Tip: You can customize what is shown in {{ command "settings" }}</i>'
