affiliate_instructions:
  parse: html
  disable_preview: true
  str: |-
    Используйте свою партнёрскую ссылку Chaturbate, чтобы выплаты шли вам.
    Сначала выберите, как вы хотите получать оплату.

    <b>1. Токены за регистрацию</b>
    Откройте <a href="https://chaturbate.com/b">chaturbate.com/b</a>,
    прокрутите в самый низ и скопируйте <b>первую</b> ссылку оттуда.
    Вы получаете 10 токенов за каждого зарегистрировавшегося пользователя
    и 500 токенов за того, кто начнёт вещать
    (он должен сначала заработать $20.00).

    <b>2. 20% от расходов</b>
    Откройте <a href="https://chaturbate.com/affiliates">chaturbate.com/affiliates</a>,
    прокрутите в самый низ и скопируйте ссылку оттуда.
    Вы получаете 20% от всего, что потратят ваши пользователи.

    Затем отправьте скопированную ссылку сюда, вот так:
    <code>{{ command "affiliate" }} https://chaturbate.com/in/?tour=LQps&amp;campaign=WIl8t&amp;track=default&amp;room={{ template "sample_streamer" }}</code>

    <i>Страницы и выплаты выше — то, что Chaturbate публиковал
    на момент написания, и с тех пор могло измениться.
    Актуальные условия смотрите на их сайте.</i>
faq_no_notifications:
  parse: html
  str: >
    <b>Я подписался на модель, но не получаю оповещений</b>

    Мы используем тот же список моделей в сети, что и некоторые сайты используют для рекламы.
    Некоторые модели не хотят там появляться, поэтому мы не можем знать, когда они в сети.
    Вы можете рассказать модели об этом боте, и, возможно, она изменит своё мнение.
    Для этого ей нужно будет изменить настройку: <b>My Profile</b> → <b>Settings &amp; Privacy</b> → <b>Appear on network sites</b> → <b>Yes</b>.
    Пожалуйста, дайте нам знать, если для некоторых моделей не приходят оповещения, и мы попробуем исправить это.
    Тем не менее, нет гарантий, что это исправит ситуацию.
faq_direct_subscriptions:
  parse: html
  str: >
    <b>Было бы здорово, если бы можно было подписаться на модель прямо с её страницы</b>

    Некоторые модели вставляют в свои профили ссылки и плавающие иконки именно для этого.
    Вы можете рассказать модели об этой возможности.
    Модель может написать нам по адресу siren.chat@gmail.com, и мы бесплатно нарисуем плавающую иконку специально для неё.
