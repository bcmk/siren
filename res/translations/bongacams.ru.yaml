site:
  parse: html
  str: BongaCams
streamers_accusative:
  parse: raw
  str: моделей
add_error:
  parse: html
  str: |-
    Не получилось добавить модель {{ .streamer }}
    Проверьте идентификатор модели или попробуйте позже
    {{ template "address_line" }}
    {{- if .has_button }}{{ print "\n" }}{{ template "or_button_hint" }}{{ end }}
help:
  parse: html
  disable_preview: true
  str: |-
    {{ template "hello" .website_link }}

    {{ template "commands" }}

    {{ template "address_line" }}

    {{ template "languages" }}

    {{ template "sites" }}

    {{ template "social" }}
languages:
  parse: html
  str: |-
    <b>Этот бот на других языках</b>
    English: <a href="https://t.me/BongacamsOnlineBot">BongacamsOnlineBot</a>
sites:
  parse: html
  str: |-
    <b>Этот бот для других сайтов</b>
    Chaturbate: <a href="https://t.me/ChaturbateSirenBot">ChaturbateSirenBot</a>
    Stripchat: <a href="https://t.me/StripchatSirenBot">StripchatSirenBot</a>
    LiveJasmin: <a href="https://t.me/RuLiveJasminSirenBot">RuLiveJasminSirenBot</a>
    CamSoda: <a href="https://t.me/RuCamSodaSirenBot">RuCamSodaSirenBot</a>
    Flirt4Free: <a href="https://t.me/RuFlirt4FreeSirenBot">RuFlirt4FreeSirenBot</a>
    Streamate: <a href="https://t.me/RuStreamateSirenBot">RuStreamateSirenBot</a>
    CAM4: <a href="https://t.me/C4SirenBot">C4SirenBot</a>
    Twitch: <a href="https://t.me/TwitchSirenBot">TwitchSirenBot</a>
    Kick: <a href="https://t.me/KickSirenBot">KickSirenBot</a>
    MyFreeCams: <a href="https://t.me/MyFreeCamsSirenBot">MyFreeCamsSirenBot</a>
sample_streamer:
  parse: raw
  str: your_cam_name
add_example:
  parse: html
  str: '{{ command "add" }} bbbweb'
remove_example:
  parse: html
  str: '{{ command "remove" }} bbbweb'
affiliate_instructions:
  parse: html
  disable_preview: true
  str: >-
    Есть два способа получать выплаты за наши ссылки.


    <b>Вы модель</b>

    На BongaModels откройте <a href="https://bongamodels.com/promo-tools/members">Referral Program / Member Referral</a>
    и скопируйте ссылку из раздела <b>To refer members</b>.
    Затем отправьте скопированную ссылку сюда, вот так:

    <code>{{ command "affiliate" }} https://bongacams.com?fuid=241616110</code>


    <b>Вы партнёр</b>

    На BongaCash откройте <a href="https://bongacash.com/promo/direct-link">Direct link</a>
    и скопируйте ссылку там.
    Затем отправьте скопированную ссылку сюда, вот так:

    <code>{{ command "affiliate" }} https://bongacams4.com/track?v=2&amp;c=673886</code>


    <i>Страницы выше — то, что BongaModels и BongaCash публиковали на момент написания,
    и с тех пор могло измениться.
    Актуальные условия смотрите на их сайтах.</i>
address_line:
  parse: html
  str: Используйте идентификатор модели из адресной строки браузера
syntax_add:
  parse: html
  str: |-
    Укажите модель, например, <code>{{ template "add_example" }}</code>

    {{ template "address_line" }}
    {{- if .has_button }}{{ print "\n" }}{{ template "or_button_hint" }}{{ end }}
syntax_remove:
  parse: html
  str: |-
    Укажите модель, например, <code>{{ template "remove_example" }}</code>

    {{ template "address_line" }}
    {{- if .has_button }}{{ print "\n" }}{{ template "or_button_hint" }}{{ end }}
unknown_command:
  parse: html
  str: |-
    Такой команде не обучен. Чтобы подписаться на модель, наберите

    {{ command "add" }} <code>МОДЕЛЬ</code>

    {{ template "address_line" }}

    Пример

    {{ template "add_example" }}
zero_subscriptions:
  parse: html
  str: |-
    Вы не подписаны ни на одну модель
    Чтобы подписаться, наберите

    {{ command "add" }} <code>МОДЕЛЬ</code>

    {{ template "address_line" }}
faq_no_notifications:
  parse: html
  str: >
    <b>Я подписался на модель, но не получаю оповещений</b>

    Для того, чтобы узнать, какие модели сейчас в сети, мы используем тот же список, что и некоторые сайты используют для рекламы BongaCams.
    Часть моделей не хочет там появляться, поэтому они отключили эту функцию, и мы не можем знать, когда они в сети.
    Вы можете рассказать модели об этом боте, и, возможно, она изменит своё мнение.
faq:
  parse: html
  str: |-
    {{ template "faq_no_notifications" }}

    {{ template "faq_pricing" . }}
