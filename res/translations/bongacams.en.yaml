site:
  parse: html
  str: BongaCams
streamers_accusative:
  parse: raw
  str: models
add_error:
  parse: html
  str: |-
    Could not add the model {{ .streamer }}
    Check the camname or try later
    {{ template "address_line" }}
    {{- if .has_button }}{{ print "\n" }}{{ template "or_button_hint" }}{{ end }}
help:
  parse: html
  disable_preview: true
  str: |-
    {{ template "hello" .website_link }}

    {{ template "commands" }}

    {{ template "address_line" }}

    {{ template "languages" }}

    {{ template "sites" }}

    {{ template "social" }}
languages:
  parse: html
  str: |-
    <b>This bot in other languages</b>
    Русский: <a href="https://t.me/BongacamsSirenBot">BongacamsSirenBot</a>
sites:
  parse: html
  str: |-
    <b>This bot for other sites</b>
    Chaturbate: <a href="https://t.me/ChaturbateAlarmBot">ChaturbateAlarmBot</a>
    Stripchat: <a href="https://t.me/StripchatOnlineBot">StripchatOnlineBot</a>
    LiveJasmin: <a href="https://t.me/LiveJasminSirenBot">LiveJasminSirenBot</a>
    CamSoda: <a href="https://t.me/CamSodaSirenBot">CamSodaSirenBot</a>
    Flirt4Free: <a href="https://t.me/Flirt4FreeSirenBot">Flirt4FreeSirenBot</a>
    Streamate: <a href="https://t.me/StreamateSirenBot">StreamateSirenBot</a>
    CAM4: <a href="https://t.me/C4SirenBot">C4SirenBot</a>
    Twitch: <a href="https://t.me/TwitchSirenBot">TwitchSirenBot</a>
    Kick: <a href="https://t.me/KickSirenBot">KickSirenBot</a>
    MyFreeCams: <a href="https://t.me/MyFreeCamsSirenBot">MyFreeCamsSirenBot</a>
sample_streamer:
  parse: raw
  str: your_cam_name
add_example:
  parse: html
  str: '{{ command "add" }} bbbweb'
remove_example:
  parse: html
  str: '{{ command "remove" }} bbbweb'
affiliate_instructions:
  parse: html
  disable_preview: true
  str: >-
    There are two ways to make the payouts yours.


    <b>You are a model</b>

    On BongaModels, open <a href="https://bongamodels.com/promo-tools/members">Referral Program / Member Referral</a>
    and copy a link under <b>To refer members</b>.
    Then send the copied link here, like this:

    <code>{{ command "affiliate" }} https://bongacams.com?fuid=241616110</code>


    <b>You are an affiliate</b>

    On BongaCash, open <a href="https://bongacash.com/promo/direct-link">Direct link</a>
    and copy the link there.
    Then send the copied link here, like this:

    <code>{{ command "affiliate" }} https://bongacams4.com/track?v=2&amp;c=673886</code>


    <i>The pages above are what BongaModels and BongaCash published
    at the time of writing and may have changed since.
    Check their sites for the current terms.</i>
address_line:
  parse: html
  str: Use the camname from an address line of your browser
syntax_add:
  parse: html
  str: |-
    Specify a model, e.g., <code>{{ template "add_example" }}</code>

    {{ template "address_line" }}
    {{- if .has_button }}{{ print "\n" }}{{ template "or_button_hint" }}{{ end }}
syntax_remove:
  parse: html
  str: |-
    Specify a model, e.g., <code>{{ template "remove_example" }}</code>

    {{ template "address_line" }}
    {{- if .has_button }}{{ print "\n" }}{{ template "or_button_hint" }}{{ end }}
unknown_command:
  parse: html
  str: |-
    Unknown command. To subscribe to a model enter

    {{ command "add" }} <code>CAMNAME</code>

    {{ template "address_line" }}

    Example

    {{ template "add_example" }}
zero_subscriptions:
  parse: html
  str: |-
    You are not subscribed to any model
    To subscribe enter

    {{ command "add" }} <code>CAMNAME</code>

    {{ template "address_line" }}
faq_no_notifications:
  parse: html
  str: >
    <b>I've subscribed to a model but I don't receive notifications</b>

    We use the same list of online models as affiliate sites use for advertisements.
    Some models decided to not appear there so we cannot know when they are online.
    You can tell a model about this bot and a model may probably change their mind on this setting.
faq:
  parse: html
  str: |-
    {{ template "faq_no_notifications" }}

    {{ template "faq_pricing" . }}
